name: Validate journal website

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test the static website
        run: npm test
      - name: Build public pages
        run: npm run build
      - name: Install pinned PDF inspection dependency
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r requirements-security.txt
      - name: Test publication security checks
        run: python3 -m unittest discover -s tests -p 'test_security_*.py'
      - name: Inspect all public PDFs and SVGs
        run: python3 scripts/audit_public_assets.py public
